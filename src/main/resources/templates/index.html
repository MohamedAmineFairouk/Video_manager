<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Arcad</title>

    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/player.css">
    <script src="/js/index.js" defer></script>
</head>
<body>
<div class="app">
    <div class="sidebar">
        <div style="display:flex; align-items:center; gap:12px; margin-bottom:18px;">
            <img src="/2938237.png" alt="icon" style="width:38px; height:38px; border-radius:10px; box-shadow:0 2px 8px #0003;">
            <span style="font-family:'Segoe UI',Arial,sans-serif; font-size:1.7rem; font-weight:800; letter-spacing:0.04em; background:linear-gradient(90deg,#38bdf8,#6366f1);-webkit-background-clip:text;-webkit-text-fill-color:transparent; background-clip:text; color:transparent;">Ar44</span>
            <button onclick="location.href='/settings'" title="Réglages" style="margin-left:auto; background:rgba(59,130,246,0.22); border:none; color:#93c5fd; border-radius:50%; width:32px; height:32px; display:flex; align-items:center; justify-content:center; font-size:16px; cursor:pointer;">⚙</button>
            <button onclick="logout()" title="Déconnexion" style="background:rgba(239,68,68,0.18); border:none; color:#f87171; border-radius:50%; width:32px; height:32px; display:flex; align-items:center; justify-content:center; font-size:18px; cursor:pointer; transition:background 0.2s;" onmouseover="this.style.background='rgba(239,68,68,0.32)'" onmouseout="this.style.background='rgba(239,68,68,0.18)'">
                <svg xmlns='http://www.w3.org/2000/svg' width='18' height='18' fill='none' viewBox='0 0 24 24'><path stroke='#f87171' stroke-width='2' stroke-linecap='round' stroke-linejoin='round' d='M17 17L7 7m10 0L7 17'/></svg>
            </button>
        </div>

        <div class="nav-chip-wrap">
            <button class="nav-chip active" onclick="location.href='/'">Bibliothèque</button>
            <button class="nav-chip" onclick="location.href='/favorites'">Favoris</button>
            <button class="nav-chip" onclick="location.href='/tags'">Tags</button>
            <button class="nav-chip" onclick="location.href='/recently'">Récemment vus</button>
            <button class="nav-chip" onclick="location.href='/stats'">Statistiques</button>
            <button class="nav-chip" style="background:linear-gradient(90deg,#38bdf8,#6366f1);color:#fff;font-weight:700;gap:6px;" onclick="openAddVideoModal()">
                Ajouter une vidéo
            </button>
        </div>


        <div class="filter-box">
            <p class="section-title">Tri</p>
            <select id="sortSelect" class="selector" onchange="onSortChange()">
                <option value="name-asc">Nom (A-Z)</option>
                <option value="name-desc">Nom (Z-A)</option>
                <option value="recent" selected>Plus récent</option>
                <option value="oldest">Plus ancien</option>
            </select>
        </div>


        <div class="filter-box">
            <p class="section-title">Creator</p>
            <select id="creatorSelect" class="selector" onchange="onFilterChange()">
                <option value="">Tous</option>
            </select>
        </div>
        <div class="filter-box">
            <p class="section-title">Level</p>
            <div id="levelFilterStars" style="display:flex; gap:4px; align-items:center; margin-bottom:4px;"></div>
            <button class="btn-secondary" style="font-size:12px; padding:4px 10px; margin-top:2px;" onclick="setLevelFilter(null)">Tous</button>
            <input type="hidden" id="sourceIndexSelect" value="">
        </div>

        <div class="filter-box">
            <p class="section-title">Tag</p>
            <select id="tagSelect" class="selector" onchange="onFilterChange()" multiple size="4">
                <option value="">Tous</option>
            </select>
            <div class="muted-note">(Ctrl/Cmd + clic pour plusieurs)</div>
        </div>
        <div class="filter-box">
            <label>
                <input type="checkbox" id="favoriteFilter" onchange="onFilterChange()">
                Favoris
            </label>
        </div>
        <div class="filter-box">
            <button class="btn-secondary" onclick="resetFilters()">Réinitialiser les filtres</button>
        </div>

        <div id="status" class="status"></div>
        <details class="accordion" open>
            <summary>Sélection</summary>
            <div class="accordion-body">
                <div class="compact-grid">
                    <button class="btn-secondary" onclick="selectAllVisible()" style="font-size:12px; padding:6px 8px; margin-top:0;">Tout sél.</button>
                    <button class="btn-secondary" onclick="selectNone()" style="font-size:12px; padding:6px 8px; margin-top:0;">Annuler</button>
                </div>
                <button class="btn" onclick="exportM3U()" style="font-size:12px; padding:7px 8px; background:rgba(34,212,153,0.95);">Exporter M3U</button>
                <div id="selectionCount" style="font-size:11px; color:#93c5fd; margin-top:6px;"></div>
            </div>
        </details>

        <!-- Le bouton d'ajout vidéo est uniquement dans la nav principale ci-dessus -->

    </div>

    <main class="content">
        <div style="display:flex; align-items:center; gap:12px; margin-bottom:10px;">
            <img src="/2938237.png" alt="icon" style="width:32px; height:32px; border-radius:8px; box-shadow:0 2px 8px #0003;">
            <span style="font-family:'Segoe UI',Arial,sans-serif; font-size:2.1rem; font-weight:900; letter-spacing:0.04em; background:linear-gradient(90deg,#38bdf8,#6366f1);-webkit-background-clip:text;-webkit-text-fill-color:transparent; background-clip:text; color:transparent;">Ar44</span>
        </div>

        <!-- Suppression de la barre de création rapide, le bouton est maintenant dans la nav -->

        <div class="list-controls">
            <div id="videoCount" class="count-box"></div>
            <label style="font-size:13px; color:#cbd5e1; display:flex; align-items:center; gap:8px;">
                Afficher
                <select id="pageSizeSelect" class="page-size-select" onchange="onPageSizeChange()">
                    <option value="20">20</option>
                    <option value="50" selected>50</option>
                    <option value="100">100</option>
                    <option value="200">200</option>
                </select>
            </label>
        </div>
        <div id="pagination" class="pagination"></div>
        <div id="videos" class="video-grid"></div>
    </main>
<!-- Modal d'ajout vidéo -->
<div id="addVideoModal" style="display:none; position:fixed; inset:0; z-index:10000; background:rgba(0,0,32,0.88); align-items:center; justify-content:center;">
    <form id="addVideoForm" style="background:linear-gradient(135deg,#0ea5e9,#6366f1); border-radius:18px; box-shadow:0 8px 32px #0008; padding:36px 32px 28px 32px; min-width:340px; max-width:98vw; width:400px; color:#fff; display:flex; flex-direction:column; gap:18px; position:relative;">
        <button type="button" onclick="closeAddVideoModal()" style="position:absolute; top:16px; right:16px; background:rgba(15,23,42,0.7); color:#fff; border:none; border-radius:8px; width:32px; height:32px; font-size:18px; cursor:pointer;">✕</button>
        <h2 style="margin:0 0 8px 0; font-size:1.5rem; font-weight:800; letter-spacing:0.03em; text-align:center; background:linear-gradient(90deg,#fff,#bae6fd,#818cf8);-webkit-background-clip:text;-webkit-text-fill-color:transparent; background-clip:text; color:transparent;">Nouvelle vidéo</h2>
        <input name="title" class="host-input" type="text" placeholder="Titre de la vidéo" required style="background:rgba(255,255,255,0.08); color:#fff;" />
        <input name="fileName" class="host-input" type="text" placeholder="Nom du fichier (ex: A69_001_DDDD.mp4)" required style="background:rgba(255,255,255,0.08); color:#fff;" />
        <input name="creators" class="host-input" type="text" placeholder="Créateurs (séparés par virgule)" style="background:rgba(255,255,255,0.08); color:#fff;" />
        <input name="tags" class="host-input" type="text" placeholder="Tags (séparés par virgule)" style="background:rgba(255,255,255,0.08); color:#fff;" />
        <input name="sourceIndex" class="host-input" type="number" min="1" max="5" placeholder="Niveau (1-5)" style="background:rgba(255,255,255,0.08); color:#fff;" />
        <input name="createdAt" id="createdAtInput" class="host-input" type="text" placeholder="Date de création" readonly style="background:rgba(255,255,255,0.08); color:#fff;" />
        <label style="font-size:13px; color:#e0e7ef;">Thumbnail <span style="color:#f87171;">*</span> <input name="thumbnail" type="file" accept="image/*" required style="margin-left:8px;" /></label>
        <label style="font-size:13px; color:#e0e7ef;">Vidéo (optionnelle) <input name="videoFile" type="file" accept="video/mp4,video/*" style="margin-left:8px;" /></label>
        <button type="submit" class="nav-chip" style="margin-top:10px; font-size:1.1rem; display:flex; align-items:center; justify-content:center; gap:8px;">
            Ajouter
        </button>
        <div id="addVideoStatus" style="font-size:13px; min-height:18px; color:#bae6fd; text-align:center;"></div>
    </form>
</div>

</div>
<div id="playerModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.85); z-index:9999; align-items:center; justify-content:center;">
    <div id="playerShell" class="player-shell" style="width:95%; max-width:1440px; max-height:94vh; background:linear-gradient(135deg, #0b1225, #0f172a); border-radius:16px; overflow:auto; border:1px solid rgba(59,130,246,0.3);">
        <div class="player-layout">
            <div class="player-main-column">
                <div class="player-video-wrap">
                    <video id="mainPlayer" autoplay></video>
                    <div id="bufferingIndicator" class="buffering-indicator"></div>
                </div>
                <div class="yt-controls">
            <div class="yt-progress-row">
                <span id="currentTime" class="yt-time">00:00</span>
                <div class="yt-seek-wrap">
                    <input id="seekBar" class="yt-seek" type="range" min="0" max="100" step="0.1" value="0" oninput="onSeekBarInput(this.value)">
                    <span id="seekPreview" class="seek-preview">00:00</span>
                </div>
                <span id="totalTime" class="yt-time">00:00</span>
            </div>
            <div class="yt-actions">
                <div class="yt-actions-left">
                    <button id="playPauseBtn" class="yt-btn" onclick="playOrPause()">▶</button>
                    <button class="yt-btn" onclick="seekBy(-10)">-10s</button>
                    <button class="yt-btn" onclick="seekBy(10)">+10s</button>
                    <button id="prevBtn" class="yt-btn" onclick="playPrevious()">Préc</button>
                    <button id="nextBtn" class="yt-btn" onclick="playNext()">Suiv</button>
                    <button id="muteBtn" class="yt-btn" onclick="toggleMute()">🔊</button>
                    <input id="volumeSlider" class="yt-range" type="range" min="0" max="1" step="0.01" value="1" oninput="setVolume(this.value)">
                </div>

                <div class="yt-actions-right">
                    <select id="speedSelect" class="yt-select" onchange="changeSpeed(this.value)">
                        <option value="0.5">0.5x</option>
                        <option value="0.75">0.75x</option>
                        <option value="1" selected>1x</option>
                        <option value="1.25">1.25x</option>
                        <option value="1.5">1.5x</option>
                        <option value="2">2x</option>
                    </select>
                    <button id="theaterBtn" class="yt-btn" onclick="toggleTheaterMode()">Théâtre</button>
                    <button id="fullScreenBtn" class="yt-btn" onclick="toggleFullScreen()">Plein écran</button>
                    <button id="favoriteModalBtn" class="yt-btn" onclick="toggleFavoriteModal(playerVideos[currentIndex]?.id, this)">Favori</button>
                    <button class="yt-btn" onclick="openDeleteConfirm()">Supprimer</button>
                    <button class="yt-btn" onclick="closePlayer()">Fermer</button>
                </div>
            </div>
                </div>
                <section class="player-info-panel" aria-label="Informations de la vidéo">
                    <div style="display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap;">
                        <div style="flex:1; min-width:250px;">
                            <h3 id="playerTitle" style="margin:0 0 8px 0; font-size:22px; font-weight:700; color:#dbeafe;">Lecture vidéo</h3>
                            <div id="playerSubtitle" style="font-size:13px; color:#94a3b8;">Informations de la vidéo</div>
                        </div>
                        <div style="display:flex; gap:10px; align-items:center; flex-wrap:wrap;">
                            <div style="display:flex; align-items:center; gap:6px; background:rgba(59,130,246,0.15); padding:6px 12px; border-radius:8px; border:1px solid rgba(59,130,246,0.2);">
                                <span style="font-size:12px; color:#94a3b8;">Favoris:</span>
                                <strong id="playerFavoriteState" style="color:#60a5fa;">Non</strong>
                            </div>
                            <div style="display:flex; align-items:center; gap:6px; background:rgba(59,130,246,0.15); padding:6px 12px; border-radius:8px; border:1px solid rgba(59,130,246,0.2);">
                                <span style="font-size:12px; color:#94a3b8;" id="playerDuration">00:00 / 00:00</span>
                            </div>
                        </div>
                    </div>
                    <div style="margin-top:12px; display:flex; gap:8px; align-items:center; flex-wrap:wrap; padding:10px 12px; background:rgba(15,23,42,0.8); border:1px solid rgba(148,163,184,0.2); border-radius:10px;">
                        <label style="font-size:11px; font-weight:600; color:#94a3b8; text-transform:uppercase; letter-spacing:0.05em; margin:0;">Tags:</label>
                        <div id="tagCheckboxesContainer" style="display:flex; flex-direction:row; flex-wrap:wrap; gap:6px; align-items:center;"></div>
                        <button class="yt-btn" type="button" onclick="createTagForCurrentVideo()">+ Tag</button>
                        <label style="font-size:11px; font-weight:600; color:#94a3b8; text-transform:uppercase; letter-spacing:0.05em; margin:0 0 0 8px;">Creators:</label>
                        <div id="creatorBadgesContainer" style="display:flex; flex-direction:row; flex-wrap:wrap; gap:6px; align-items:center;"></div>
                        <label style="font-size:11px; font-weight:600; color:#94a3b8; text-transform:uppercase; letter-spacing:0.05em; margin:0 0 0 8px;">Niveau:</label>
                        <div id="levelStarsContainer" style="display:flex; align-items:center; gap:2px;"></div>
                        <span id="levelValue" style="font-weight:700; color:#60a5fa; font-size:12px; min-width:15px; text-align:center;">0</span>
                        <button onclick="saveModalCombined()" title="Enregistrer" style="background:linear-gradient(135deg, #3b82f6, #2563eb); color:white; border:none; padding:4px 8px; border-radius:6px; cursor:pointer; font-size:14px; transition:all 0.2s ease; box-shadow:0 2px 6px rgba(59,130,246,0.25); display:flex; align-items:center; justify-content:center; height:28px; width:28px;">💾</button>
                    </div>
                </section>
            </div>
            <aside class="up-next-panel" aria-label="Vidéos à suivre">
                <h3 class="up-next-title">À suivre</h3>
                <div id="upNextList" class="up-next-list"></div>
            </aside>
        </div>
    </div>
</div>

<div id="confirmModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.8); z-index:10000; align-items:center; justify-content:center;">
    <div style="width:90%; max-width:420px; background:linear-gradient(135deg, #0b1225, #0f172a); border-radius:14px; padding:24px; border:1px solid rgba(59,130,246,0.3); box-shadow:0 20px 50px rgba(0,0,0,0.5);">
        <h3 style="margin:0 0 12px 0; font-size:18px; font-weight:700; color:#dbeafe;">Confirmer la suppression</h3>
        <p id="confirmText" style="color:#e0f2fe; margin:0 0 20px 0; font-size:14px; line-height:1.5;">Confirmer la suppression ?</p>
        <div style="display:flex; justify-content:flex-end; gap:10px;">
            <button onclick="closeDeleteConfirm()" style="background:linear-gradient(135deg, #3b82f6, #2563eb); color:white; border:none; padding:10px 16px; border-radius:8px; cursor:pointer; font-weight:600; font-size:13px; transition:all 0.2s ease; box-shadow:0 2px 8px rgba(59,130,246,0.25);" onmouseover="this.style.background='linear-gradient(135deg, #2563eb, #1d4ed8)';this.style.transform='translateY(-1px)'" onmouseout="this.style.background='linear-gradient(135deg, #3b82f6, #2563eb)';this.style.transform='translateY(0)'">
                Annuler
            </button>
            <button onclick="confirmDelete()" style="background:linear-gradient(135deg, #0080ff, #dc2626); color:white; border:none; padding:10px 16px; border-radius:8px; cursor:pointer; font-weight:600; font-size:13px; transition:all 0.2s ease; box-shadow:0 2px 8px rgba(239,68,68,0.25);" onmouseover="this.style.background='linear-gradient(135deg, #dc2626, #b91c1c)';this.style.transform='translateY(-1px)'" onmouseout="this.style.background='linear-gradient(135deg, #0080ff, #dc2626)';this.style.transform='translateY(0)'">
                Supprimer
            </button>
        </div>
    </div>
</div>

</body>
</html>
