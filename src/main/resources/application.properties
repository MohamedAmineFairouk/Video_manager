spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/db_video}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:123456}
spring.jpa.hibernate.ddl-auto=update
spring.main.banner-mode=off
# Relative to the working directory the jar is launched from (see run.bat).
app.thumbnails.dir=${THUMBNAILS_DIR:D:/Programs/apache-maven-3.8.6/lib/ext/load_sheet/Ar44_Portable/thumbnails}
app.videos.dir=${VIDEOS_DIR:D:/Programs/apache-maven-3.8.6/lib/ext/load_sheet/Ar44_Portable/videos}
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=200MB
server.port=${SERVER_PORT:8080}
spring.flyway.enabled=false
# Streaming a video takes as long as it's watched; the container's default
# 30s async timeout was killing the /api/videos/file connection mid-playback.
spring.mvc.async.request-timeout=-1

# Only warnings/errors are logged (e.g. video streaming cut off mid-playback);
# no per-request/progress noise. Bump to DEBUG on VideoController if deeper
# streaming diagnostics are needed again.
logging.level.root=WARN
# Written next to the jar since run.bat cd's into the jar's own folder before
# launching it; rotates automatically (Spring Boot / logback defaults).
logging.file.name=ar44.log